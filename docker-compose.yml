name: stylelens

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://stylelens:stylelens@postgres:5432/stylelens
    REDIS_URL: redis://redis:6379/0
    # Uploaded files, page renders and images live in a shared Docker volume. To use S3 or another
    # S3-compatible store instead, set STORAGE_BACKEND=s3 and the S3_* variables in .env.
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    STORAGE_LOCAL_ROOT: /data/objects
    PROMPTS_DIR: /app/prompts
    HF_HOME: /models
  volumes:
    - ./prompts:/app/prompts:ro
    - models:/models
    - objects:/data/objects
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stylelens
      POSTGRES_PASSWORD: stylelens
      POSTGRES_DB: stylelens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylelens"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20


  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn stylelens.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30

  worker:
    <<: *backend
    command: arq stylelens.worker.settings.WorkerSettings
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  objects:
  models:
