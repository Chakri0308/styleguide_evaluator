[project]
name = "stylelens"
version = "0.1.0"
description = "StyleLens backend: style guide ingestion, retrieval, comparison and chat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "arq>=0.26",
  "redis>=5.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "pillow>=10.3",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "anthropic>=0.40",
  "jinja2>=3.1",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "moto[s3]>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stylelens*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
